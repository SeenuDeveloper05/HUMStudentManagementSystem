/* ====================================== */

.hum-mark-entry-container {
    background: #ffffff;
    border: 1px solid #dfe7f1;
    border-radius: 9px;
    padding: 13px;
}

.hum-mark-entry-grid {
    display: grid;
    grid-template-columns: minmax(180px, 2fr) repeat(5, minmax(85px, 1fr));
    gap: 10px;
    align-items: end;
}

.hum-mark-entry-field {
    min-width: 0;
}

/* ====================================== */
/* ADD ANOTHER BUTTON */
/* ====================================== */

.hum-mark-add-another-btn {
    background: #ffffff;
    border: 1px solid #17365d;
    border-radius: 7px;
    color: #17365d;
    padding: 7px 13px;
    font-size: 12px;
    font-weight: 600;
}

.hum-mark-add-another-btn:hover {
    background: #eff4fa;
    color: #12365f;
}

/* ====================================== */
/* ADDED STUDENTS TABLE */
/* ====================================== */

.hum-mark-bulk-table-container {
    background: #ffffff;
    border: 1px solid #e0e7f0;
    border-radius: 9px;
    overflow: hidden;
    margin-top: 15px;
}

.hum-mark-bulk-table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.hum-mark-bulk-table {
    width: 100%;
    margin-bottom: 0;
    vertical-align: middle;
    white-space: nowrap;
}

.hum-mark-bulk-modal .hum-mark-bulk-table thead th {
    background: #f8fafc;
    color: #5c6d89;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 10px;
    border-bottom: 1px solid #e0e7f0;
}

.hum-mark-bulk-modal .hum-mark-bulk-table tbody td {
    color: #172033;
    font-size: 11px;
    padding: 9px 10px;
    border-bottom: 1px solid #e4eaf2;
}

.hum-mark-bulk-modal .hum-mark-bulk-table tbody tr:last-child td {
    border-bottom: 0;
}

.hum-mark-bulk-table .student-name-cell {
    font-weight: 600;
    color: #17365d;
}

/* ====================================== */
/* REMOVE TABLE ROW */
/* ====================================== */

.hum-mark-entry-remove {
    width: 29px;
    height: 29px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #f2caca;
    border-radius: 6px;
    background: #ffffff;
    color: #dc3545;
    font-size: 12px;
}

.hum-mark-entry-remove:hover {
    background: #ffe3e3;
    color: #dc3545;
}

/* ====================================== */

.hum-mark-bulk-modal .modal-footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 8px 15px;
    border-top: 1px solid #e0e7f0;
    background: #ffffff;
}

/* Save Button */

.hum-mark-bulk-save-btn {
    background: #102f59;
    color: #ffffff;
    border: 1px solid #102f59;
    border-radius: 7px;
    padding: 6px 15px;
    font-size: 12px;
    font-weight: 600;
}

.hum-mark-bulk-save-btn:hover {
    background: #2879d5;
    color: #ffffff;
}

/* Cancel Button */

.hum-mark-bulk-cancel-btn {
    background: #ffffff;
    color: #17365d;
    border: 1px solid #d4e1f0;
    border-radius: 7px;

    font-size: 12px;
}

.hum-mark-bulk-cancel-btn:hover {
    background: #eff4fa;
